name: Ruff Check
# push'ta yalnizca dev ve main: bir dalda acik PR varken hem push hem
# pull_request tetikleniyordu ve ayni commit icin butun is iki kez
# kosuyordu (ornegin 3ae7e78 icin 70 ve 71 numarali calismalar). Dal
# calismalari artik PR uzerinden geliyor; kapsamda kayip yok, kontrol
# PR acilinca kosuyor. (main henuz yok, ileride acilirsa kapsanmis olsun
# diye listede.)
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  # Art arda push yapildiginda yalnizca son commit'in sonucu onemli;
  # eskisini iptal etmek hem runner'i hem sirayi bosaltiyor. dev ve
  # main'de iptal yok: oradaki her commit'in kendi kaydi kalsin.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # NEDEN UCUNCU PARTI ACTION DEGIL: Onceki hali chartboost/ruff-action@v1
      # idi ve kendi getirdigi ruff surumunu, repo'nun pin'ini yok sayarak
      # calistiriyordu. Sonuc: CI ile yerel farkli kural setleri uyguluyor,
      # birinde gecen kod digerinde patliyordu. Surum artik tek yerde:
      # requirements-dev.txt.
      - name: Install ruff
        run: pip install "$(grep -m1 '^ruff' requirements-dev.txt | sed 's/#.*//' | xargs)"

      - name: Show ruff version
        run: ruff --version

      - name: Run ruff
        run: ruff check .

      # NEDEN FORMAT DENETIMI DE BURADA: kanca (scripts/hooks/pre-commit)
      # opt-in -- "git config core.hooksPath scripts/hooks" calistirmamis
      # biri format bozuk kod push edebilir. Denetim yalnizca kancada
      # olsaydi, bir seferlik yapilan bicimlendirme zamanla yine dagilirdi.
      #
      # Kanca ile bu adim AYNI komutlari kosuyor; biri degisirse digeri de
      # degismeli.
      - name: Check formatting
        run: ruff format --check .
